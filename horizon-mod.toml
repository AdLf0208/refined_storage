id = "refinedstorage"
name = "Refined Storage"
version = "0.2.2"
description = """A port of Refined Storage 2.0.9 for Horizon, scoped to the item network core: a
controller (a network is online when its connected component holds one), a cable with its six
connection states, a disk drive with nine slots of storage disks, the 1k storage disk (1,024 items,
kept in the disk item's own component) and a grid: a 9x6 menu that searches, withdraws from and
deposits into the network's disks. The crafting chain that reaches them is carried too — quartz
enriched iron and copper, silicon, processor bindings and the three processors, the machine casing,
construction and destruction cores, the 1k storage part and the storage housing — with the 21
recipes that turn vanilla materials into the five blocks and the disk. Crafters, exporters and
importers, external storage, interfaces, relays, the security manager, wireless and portable grids,
autocrafting, fluid storage and the other disk sizes are the port's gap list, not this version."""
authors = ["Refined Mods", "AdLf0208"]
license = "MIT"
homepage = "https://github.com/AdLf0208/refinedstorage"
issues = "https://github.com/refinedmods/refinedstorage2/issues"
# A native mod: Rust in src/, compiled by the launcher against the game build [native] pins,
# beside data/ and assets/. The id is the resource namespace and the only identity: Cargo's
# package name and version are not the mod's.
api = "0.2"
# "both" is the installation side: the grid and the drive draw a screen, so the client half is
# part of this package and a dedicated server needs it too.
side = "both"
# The one shared value every manifest carries ("May add blocks, items, mob effects and entity
# types"); the network's five blocks and the storage disk are content this package declares.
capabilities = ["registries"]

[native]
game = "26.3"
horizon = "0a875da91dbb0fdcb7ba8c42c11341aa229af51a"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"
