id = "refinedstorage"
name = "Refined Storage"
version = "0.2.14"
description = """A port of Refined Storage 2.0.9 for Horizon, scoped to the item network core: a
controller (a network is online when its connected component holds one), a cable with its six
connection states, a disk drive with nine slots of storage disks, the 1k storage disk (1,024 items,
kept in the disk item's own component) and a grid: a 9x6 menu that searches, withdraws from and
deposits into the network's disks. The crafting chain that reaches them is carried too — quartz
enriched iron and copper, silicon, processor bindings and the three processors, the machine casing,
construction and destruction cores, the 1k storage part, the storage housing and — for the three
larger craftable disks — the 4k, 16k and 64k storage parts, with the recipes
that turn vanilla materials into the blocks and the items. A wireless transmitter joins a
network through its facing side and answers whether a player may use that network: the same dimension,
online, and within 16 blocks. The wireless grid is the item that asks it: use it on a transmitter to bind
that transmitter's dimension and position into the item, then use it to open the network's 9x6 grid view
from anywhere inside the transmitter's range. An importer pulls resources from the inventory it faces
into the network and an exporter pushes the resources its filter names into the inventory it faces: each
has nine filter entries and four upgrade slots, its own menu, and a work tick that a speed upgrade
shortens (9 ticks, two fewer per upgrade, down to one) and a stack upgrade widens (1 item per pass, 64
with one). A range upgrade in a transmitter's own four upgrade slots raises its range by 8 blocks each
(up to four), and the creative range upgrade makes it unlimited without crossing a dimension. The
controller holds energy again, as upstream: a 1,000 FE buffer with four energy levels, a per-block
charge read from the reference (a grid 10, a drive 10 plus 4 a disk, a transmitter 16 plus 8 a range
upgrade, an importer or exporter 2 a work pass plus its upgrades), and a network that does no work —
and refuses a wireless use naming the reason — while it cannot pay it. The wireless grid is an item with
a buffer of its own: 1,000 FE, charged 5 per open, per deposit and per withdrawal, so an empty grid
moves nothing (and says so) while its network stays online. An importer, an exporter or a wireless
transmitter broken in survival carries its own slots on the dropped item — a machine's nine filter
entries and four upgrades, a transmitter's four upgrades — and gives every one back when the item is
placed again, with nothing spilled beside it: one unit's payload per placed machine, so placing one
of a stack of two leaves the other unit's payload on it, while a break that hands no item over
(creative, a cancelled break) leaves the container to the engine's own spill. The two energy
commands are operator commands, and a charge names the item it fills: the wireless grid, or nothing.
A storage disk is one of five sizes — 1k, 4k, 16k,
64k and the creative disk — and its capacity travels in the disk item's own storage component beside
its contents (a 0 there is the creative disk's unlimited marker, which never refuses an item); a drive
adds up whatever its disks say, and the 4k, 16k and 64k disks and the storage parts they are built
from are crafted out of the same chain as the 1k disk. A smaller disk and the next tier's storage
part make that bigger disk in one crafting-table step: the contents come across and the source
disk's own part is returned, and the creative disk is never a target (it has no capacity to grow
into). An external storage joins the network on any side and works through its facing side: the
inventory it faces becomes network storage, so a grid lists what the chest holds and a deposit
through the grid's menu lands in that chest, while breaking the block or removing the chest drops
that stock from the network without touching the disks. Crafters, interfaces, relays, the security
manager, the portable grid, autocrafting and fluid storage are the port's gap list, not this
version."""
authors = ["Refined Mods", "AdLf0208"]
license = "MIT"
homepage = "https://github.com/AdLf0208/refinedstorage"
issues = "https://github.com/refinedmods/refinedstorage2/issues"
# A native mod: Rust in src/, compiled by the launcher against the game build [native] pins,
# beside data/ and assets/. The id is the resource namespace and the only identity: Cargo's
# package name and version are not the mod's.
api = "0.2"
# "both" is the installation side: the grid and the drive draw a screen, so the client half is
# part of this package and a dedicated server needs it too.
side = "both"
# The one shared value every manifest carries ("May add blocks, items, mob effects and entity
# types"); the network's five blocks and the storage disk are content this package declares.
capabilities = ["registries"]

[native]
game = "26.3"
horizon = "0a875da91dbb0fdcb7ba8c42c11341aa229af51a"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"
